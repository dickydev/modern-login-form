<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barriecito&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Please enter your details login</p>
      </div>

      <form action="" class="login-form" id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            required
          />
          <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>

        <div class="options">
          <label for="" class="remember-me">
            <input type="checkbox" />Remember Me
          </label>
          <a href="#" class="forgot-password">Forgot Password</a>
        </div>
        <button type="submit" class="login-button">Sign In</button>

        <div class="signup-link">
          Don't have an account? <a href="#">Sign Up</a>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
